<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kanini Context · Dashboard</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<div id="sky" aria-hidden="true"></div>
<div class="app">
  <header class="top">
    <div class="brand">
      <span class="logo" aria-hidden="true"></span>
      <span class="name">Kanini Context</span>
      <span class="sub">Dashboard</span>
    </div>
    <nav class="orders" id="orders" aria-label="Orders"></nav>
    <div class="status" id="status">loading…</div>
  </header>

  <main class="stage">
    <section class="panel question" aria-labelledby="q-title">
      <div class="panel-head"><span class="eyebrow">The question</span></div>
      <div class="panel-body">
        <p class="ask">Does this order need prior authorization?</p>
        <h1 id="q-title">Pick an order above</h1>
        <dl class="facts" id="q-facts"></dl>
        <div class="actions">
          <button type="button" class="btn btn-agent" id="run-agent">Ask the agent</button>
          <button type="button" class="btn btn-flow" id="run-flow">Run without AI</button>
        </div>
        <div class="outcome hidden" id="outcome">
          <span class="o-label" id="o-label"></span>
          <span class="o-sub" id="o-sub"></span>
        </div>
      </div>
    </section>

    <section class="panel graph-panel" aria-label="Knowledge graph">
      <div class="panel-head">
        <span class="eyebrow">Knowledge graph</span>
        <div class="seg" role="tablist" aria-label="Graph view">
          <button type="button" role="tab" aria-selected="true" id="view-inst">Instances</button>
          <button type="button" role="tab" aria-selected="false" id="view-onto">Ontology</button>
        </div>
        <div class="zoom">
          <button type="button" aria-label="Zoom in" id="zin">+</button>
          <button type="button" aria-label="Zoom out" id="zout">−</button>
          <button type="button" aria-label="Fit the answer's path" id="zfit">Fit</button>
          <button type="button" aria-label="Show the whole graph" id="zall">All</button>
        </div>
      </div>
      <div class="graph-wrap">
        <svg id="graph" role="img" aria-label="Knowledge graph of the release"></svg>
        <div class="tip hidden" id="tip"></div>
      </div>
      <div class="panel-foot legend" id="legend"></div>
    </section>

    <aside class="side">
      <section class="panel card" id="card" aria-label="Decision card">
        <div class="panel-head"><span class="eyebrow">Decision card</span></div>
        <div class="panel-body card-empty">The decision card appears here when the agent or the workflow answers.</div>
      </section>
      <section class="panel detail hidden" id="detail" aria-label="Selected node"></section>
    </aside>
  </main>

  <section class="panel band" aria-labelledby="band-title">
    <div class="panel-head">
      <h2 id="band-title">Same order, three ways to answer it</h2>
      <div class="trace" id="trace" aria-label="Agent trace"></div>
    </div>
    <div class="lanes" id="lanes"></div>
    <div class="panel-foot log" id="log"></div>
  </section>
</div>
<script src="/static/vendor/d3.min.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
